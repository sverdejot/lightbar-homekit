# Matter (Thread) dimmable light that drives the Xiaomi lightbar over its
# proprietary 2.4 GHz protocol (MPSL timeslots). Target: nice!nano v2.
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_CHIP_DEVICE_PRODUCT_ID=32773
CONFIG_STD_CPP17=y

# Commissioning: BLE advertising starts at boot. Test credentials (no factory data):
# passcode 20202021, discriminator 3840.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=900
CONFIG_CHIP_FACTORY_DATA=n
CONFIG_CHIP_FACTORY_DATA_BUILD=n
CONFIG_BT_DEVICE_NAME="Lightbar"

# No DFU (no MCUboot / external flash on nice!nano)
CONFIG_CHIP_BOOTLOADER_NONE=y
CONFIG_CHIP_OTA_REQUESTOR=n
CONFIG_CHIP_OTA_IMAGE_BUILD=n
CONFIG_CHIP_DFU_OVER_BT_SMP=n

CONFIG_DK_LIBRARY=y
CONFIG_PWM=n
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_USE_SEGGER_RTT=n

# Lamp radio: proprietary TX in MPSL timeslots
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1

# USB CDC console + shell (matter + lamp commands)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Lightbar Matter"
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SHELL=y
CONFIG_CHIP_LIB_SHELL=y
CONFIG_NCS_SAMPLE_MATTER_TEST_SHELL=n
CONFIG_REBOOT=y

CONFIG_BUILD_OUTPUT_UF2=y
